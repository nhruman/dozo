<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category - Mottainai Connect</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Product Card CSS -->
    <link rel="stylesheet" href="css/product-card.css">
</head>

<body>

    <!-- ===== Header ===== -->
    <header id="site-header"></header>


    <!-- ===== Category Page ===== -->
    <main class="category-page">

        <div class="container">

            <!-- Category title -->
            <div class="category-heading">
                <h1 id="category-title">
                    Electronics & Gadgets
                </h1>

                <p id="category-description">
                    Find useful items shared by people in your community.
                </p>
            </div>


            <!-- ===== Product Grid ===== -->
            <section class="category-products">

                <div class="product-grid" id="product-grid">
                    <!-- Products will be added by JavaScript -->
                </div>

            </section>

        </div>

    </main>


<!-- Shared Scripts -->
<script src="js/lang.js"></script>
<script src="js/storage.js"></script>
<script src="js/components.js"></script>

<!-- Product Data -->
<script src="js/products/electronics.js"></script>
<script src="js/products/clothing.js"></script>
<script src="js/products/books.js"></script>
<script src="js/products/household.js"></script>
<script src="js/products/toys.js"></script>
<script src="js/products/furniture.js"></script>
<script src="js/products/bedding.js"></script>
<script src="js/products/sports.js"></script>
<script src="js/products/hobby.js"></script>
<script src="js/products/indoor.js"></script>

<!-- Product Card Function (NEW) -->
<script src="js/product-card.js"></script>

<!-- Category Page -->
<script src="js/category.js"></script>

</body>
</html>

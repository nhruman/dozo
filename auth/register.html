<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>新規登録 | Mottainai Connect</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>🌱 Mottainai Connect</h1>

            <h2>新規登録</h2>

            <p class="auth-description">
                アカウントを作成しましょう
            </p>

            <form id="register-form">

                <label for="name">お名前</label>
                <input
                    type="text"
                    id="name"
                    placeholder="お名前を入力"
                    autocomplete="name"
                    required
                >

                <label for="email">メールアドレス</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    placeholder="6文字以上"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="confirm-password">
                    パスワード確認
                </label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="パスワードを再入力"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

                <label for="role">アカウントタイプ</label>

                <select id="role">
                    <option value="user">一般ユーザー</option>
                    <option value="volunteer">ボランティア</option>
                </select>

                <p id="register-message" role="status" aria-live="polite"></p>

                <button type="submit" id="register-button">
                    新規登録
                </button>

            </form>

            <p class="auth-footer">
                すでにアカウントをお持ちですか？
                <a href="login.html">ログイン</a>
            </p>

            <a href="../index.html" class="back-home">
                ← ホームに戻る
            </a>

        </div>

    </div>

    <script type="module" src="../js/auth/register.js"></script>

</body>
</html>
